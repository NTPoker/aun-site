<script src="test-i18n.js?v=20261103m"></script>
<script type="module">
let track = () => {}, src = () => "direct";
const $ = id => document.getElementById(id);
const go = $("go"), box = $("whyBox"), stamp = $("stamp");
const D = window.AUN_TEST;
let seatsLeft = null, seatsFull = false;
// draw the page in the language picked in the shared header
function apply(l) {
  const d = D[l] || D.en;
  document.documentElement.lang = l;
  document.querySelectorAll("[data-t]").forEach(el => { const k = el.dataset.t; if (k.endsWith("H")) el.innerHTML = d[k]; else el.textContent = d[k]; });
  $("seatsTxt").innerHTML = seatsFull ? d.seatsFull : seatsLeft === null ? d.seatsDefault : d.seatsLeftH.replace("{n}", seatsLeft);
  if ($("state").textContent) $("state").textContent = d.pick;
}
const t = k => (D[window.AUN_SITE.lang] || D.en)[k];
apply(window.AUN_SITE.lang);
document.addEventListener("aun:lang", e => { apply(e.detail.lang); if (e.detail.chosen) track("lang"); });
// analytics load after the text is on screen, and never block the test link
({ track, src } = await import("./fb.js").catch(() => ({ track() {}, src: () => "direct" })));
// picking a reason stamps the pass with the red circle
const mark = () => stamp.classList.toggle("on", !!document.querySelector('input[name="why"]:checked'));
box.addEventListener("change", () => { mark(); $("state").textContent = ""; });
const pre = new URLSearchParams(location.search).get("why");
const preBox = pre && document.querySelector('input[name="why"][value="' + pre.replace(/[^a-z]/g, "") + '"]');
if (preBox) { preBox.checked = true; mark(); }
const full = () => { go.hidden = true; $("full").hidden = false; seatsFull = true; $("seatsTxt").textContent = t("seatsFull"); };
try {
  const cfg = await (await fetch("test-link.json?v=" + Date.now(), { cache: "no-store" })).json();
  if (cfg.open && cfg.url) {
    const base = cfg.url;
    go.hidden = false;
    const link = () => {
      const why = document.querySelector('input[name="why"]:checked');
      if (!why) return null;
      const u = new URL(base);
      u.searchParams.set("ref", ("site-" + why.value + "-" + src()).slice(0, 40));
      return u.toString();
    };
    const sync = () => { go.href = link() || "#"; };
    box.addEventListener("change", sync); sync();
    go.addEventListener("click", e => {
      if (!link()) {
        e.preventDefault();
        $("state").className = "msg err";
        $("state").textContent = t("pick");
        box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
        $("ask").scrollIntoView({ behavior: "smooth", block: "start" });
        box.querySelector("input").focus({ preventScroll: true });
        return;
      }
      track("cta");
    });
    // real seats left, from the test server; the page works without it
    fetch(new URL("/api/exam/seats", base), { cache: "no-store" }).then(r => r.ok ? r.json() : null).then(n => {
      if (!n || typeof n.left !== "number") return;
      if (n.left <= 0) return full();
      seatsLeft = n.left;
      $("seatsTxt").innerHTML = t("seatsLeftH").replace("{n}", n.left);
    }).catch(() => {});
  } else {
    full();
  }
} catch (e) {
  $("err").hidden = false;
}
track("view");
</script>
