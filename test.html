<div class="t-body">
<div class="ticket">
<div class="tk-top"><div class="tk-title"><span data-t="pass"></span><small>AUN SPEAKING TEST</small></div><img class="stamp" id="stamp" src="mark.svg" alt=""></div>
<ul class="tk-facts"><li data-t="fx1"></li><li data-t="fx2"></li><li data-t="fx3"></li><li data-t="fx4"></li></ul>

<button type="button" data-why="before"><span class="ic">03</span><span data-t="w3"></span></button>

<script src="test-i18n.js?v=20261103q"></script>
<script type="module">
let track = () => {}, src = () => "direct";
const $ = id => document.getElementById(id);
const box = $("whyBox"), stamp = $("stamp");
const D = window.AUN_TEST;
let seatsLeft = null, seatsFull = false;
// draw the page in the language picked in the shared header
function apply(l) {
  const d = D[l] || D.en;
  document.documentElement.lang = l;
  document.querySelectorAll("[data-t]").forEach(el => { const k = el.dataset.t; if (k.endsWith("H")) el.innerHTML = d[k]; else el.textContent = d[k]; });
  $("seatsTxt").innerHTML = seatsFull ? d.seatsFull : seatsLeft === null ? d.seatsDefault : d.seatsLeftH.replace("{n}", seatsLeft);
}
const t = k => (D[window.AUN_SITE.lang] || D.en)[k];
apply(window.AUN_SITE.lang);
document.addEventListener("aun:lang", e => { apply(e.detail.lang); if (e.detail.chosen) track("lang"); });
// picking a reason stamps the pass with the red circle and starts the test
const stampOn = () => stamp.classList.add("on");
let base = null, closed = false, pending = null;
const go = why => {
  const u = new URL(base);
  u.searchParams.set("ref", ("site-" + why + "-" + src()).slice(0, 40));
  track("cta");
  location.href = u.toString();
};
box.addEventListener("click", e => {
  const b = e.target.closest("button[data-why]");
  if (!b || closed) return;
  box.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  stampOn();
  $("state").textContent = t("starting");
  if (base) setTimeout(() => go(b.dataset.why), 450); else pending = b.dataset.why;
});
const full = () => { closed = true; seatsFull = true; $("full").hidden = false; box.hidden = true; $("seatsTxt").textContent = t("seatsFull"); };
// back from the test (page restored from cache): clear the "starting" state
addEventListener("pageshow", e => { if (e.persisted) { $("state").textContent = ""; stamp.classList.remove("on"); box.querySelectorAll("button").forEach(x => x.removeAttribute("aria-pressed")); } });
// analytics load after the text is on screen, and never block the test link
({ track, src } = await import("./fb.js").catch(() => ({ track() {}, src: () => "direct" })));

try {
  const cfg = await (await fetch("test-link.json?v=" + Date.now(), { cache: "no-store" })).json();
  if (cfg.open && cfg.url) {
    base = cfg.url;
    if (pending) go(pending);
    // real seats left, from the test server; the page works without it
    fetch(new URL("/api/exam/seats", base), { cache: "no-store" }).then(r => r.ok ? r.json() : null).then(n => {
      if (!n || typeof n.left !== "number") return;
      if (n.left <= 0) return full();
      seatsLeft = n.left;
      $("seatsTxt").innerHTML = t("seatsLeftH").replace("{n}", n.left);
    }).catch(() => {});
  } else {
    full();
  }
} catch (e) {
  closed = true;
  $("err").hidden = false;
}
track("view");
</script>
</body>
