<body>
<header id="site-top" class="s-top"></header><script src="site.js?v=20261104o"></script>
<main class="go1">
<p id="state" class="state" role="status" aria-live="polite" data-t="starting"></p>
<p id="err" class="shut" hidden data-t="err"></p>
<p id="full" class="shut" hidden data-t="full"></p>
</main>
<footer id="site-foot" class="s-foot"></footer>
<script src="test-i18n.js?v=20261103x"></script>
<script type="module">
// No questions here: opening this page goes straight to the test's start screen (NT 11/5: fewer taps).
import { src } from "./src.js";
const $ = id => document.getElementById(id);
const D = window.AUN_TEST;
function apply(l) {
  const d = D[l] || D.en;
  document.documentElement.lang = l;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = d[el.dataset.t]; });
}
apply(window.AUN_SITE.lang);
document.addEventListener("aun:lang", e => apply(e.detail.lang));
const shut = id => { $("state").hidden = true; $(id).hidden = false; };
const wait = ms => new Promise(r => setTimeout(r, ms));
// analytics load in the background and never hold the test link for long
const fb = import("./fb.js").catch(() => null);
const track = (...a) => fb.then(m => m && m.track(...a));
track("view");
try {
  const cfg = await (await fetch("test-link.json?v=" + Date.now(), { cache: "no-store" })).json();
  if (!cfg.open || !cfg.url) shut("full");
  else {
    // real seats left, from the test server; if it does not answer in time, go on
    const n = await Promise.race([fetch(new URL("/api/exam/seats", cfg.url), { cache: "no-store" }).then(r => r.ok ? r.json() : null).catch(() => null), wait(2500)]);
    if (n && typeof n.left === "number" && n.left <= 0) shut("full");
    else {
      const u = new URL(cfg.url);
      u.searchParams.set("ref", ("site-" + src()).slice(0, 40));
      u.searchParams.set("lang", window.AUN_SITE.lang);  // the test shows its instructions in the language picked on the site
      track("cta");
      await Promise.race([fb, wait(1200)]);
      await wait(300);  // a moment for the events to be sent
      location.replace(u.toString());  // replace: Back from the test returns to the page before this one
    }
  }
} catch (e) {
  shut("err");
}
</script>
